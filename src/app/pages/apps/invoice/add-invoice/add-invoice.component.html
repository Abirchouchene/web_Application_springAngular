<div class="bg-white shadow-xl rounded-2xl p-10 w-full max-w-7xl mx-auto my-12">
  <form [formGroup]="requestForm" (ngSubmit)="onSubmit()" class="space-y-16">

    <!-- Title -->

    <!-- Request Info Section -->
    <section>
      <h3 class="text-2xl font-semibold text-gray-700 mb-8">Request Information</h3>
      <br>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Request Type</mat-label>
          <mat-select formControlName="requestType">
            <mat-option *ngFor="let type of requestTypes" [value]="type">{{ type }}</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Category</mat-label>
          <mat-select formControlName="category">
            <mat-option *ngFor="let category of categoryRequests" [value]="category">{{ category }}</mat-option>
          </mat-select>
        </mat-form-field>
        

        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Priority Level</mat-label>
          <mat-select formControlName="priorityLevel">
            <mat-option *ngFor="let priority of priorityLevels" [value]="priority">{{ priority }}</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Deadline</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="deadline" placeholder="Choose a date" />
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>
      
    </section>

    <!-- Description Section -->
    <section>
      <h3 class="text-2xl font-semibold text-gray-700 mb-8">Description</h3>
      <mat-form-field class="w-full" appearance="outline">
        <mat-label>Description</mat-label>
        <textarea matInput formControlName="description" rows="4"></textarea>
      </mat-form-field>
    </section>
    

    <!-- Statistics Section -->
    <section *ngIf="requestForm.get('requestType')?.value === 'STATISTICS'">
      <h3 class="text-2xl font-semibold text-gray-700 mb-8">Statistics Questions</h3>
      <button mat-stroked-button color="primary" type="button" (click)="addNewQuestion()">Add Question</button>
      <div *ngFor="let question of newQuestions(); let i = index" class="flex items-center gap-4 mt-4">
        <mat-form-field class="flex-1" appearance="outline">
          <input matInput [(ngModel)]="newQuestions()[i]" [ngModelOptions]="{ standalone: true }" placeholder="Enter question" />
        </mat-form-field>
        <button mat-icon-button color="warn" (click)="removeNewQuestion(i)">
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    </section>

    <section>
      <h3 class="text-2xl font-semibold text-gray-700 mb-8">Attachments</h3>
      <div class="relative flex items-center mb-4">
        <!-- Display selected file name -->
        <input 
          type="text" 
          class="border px-4 py-2 text-sm rounded-l w-full max-w-[320px]" 
          [value]="selectedFileName" 
          readonly 
          placeholder="No file selected"
        />
    
        <!-- Choose File button (corrected with type="button") -->
        <button 
          type="button" 
          mat-flat-button 
          class="input-file-button absolute right-0 top-0 h-full mat-mdc-unelevated-button mat-unthemed mat-mdc-button-base"
          mat-ripple 
          (click)="fileInput.click()">
          <span class="mdc-button__label">Choose File</span>
    
          <!-- Hidden file input -->
          <input 
            type="file" 
            #fileInput 
            hidden 
            (change)="onFileSelected($event)" 
          />
        </button>
      </div>
    </section>
    
    
    
    <!-- Tag Search -->
    <section>
      <h3 class="text-2xl font-semibold text-gray-700 mb-8">Search by Tag</h3>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <mat-form-field class="w-full" appearance="outline">
          <mat-label>Search Contacts by Tag</mat-label>
          <input matInput [(ngModel)]="searchTag" (keyup.enter)="fetchContactsByTag()" [ngModelOptions]="{ standalone: true }" />
        </mat-form-field>
        <button mat-raised-button color="accent" type="button" (click)="fetchContactsByTag()">Search</button>
      </div>
    </section>

    <section *ngIf="contacts.length > 0">
      <h3 class="text-2xl font-semibold text-gray-700 mb-8">Select Contacts</h3>
      <mat-selection-list>
        <mat-list-option *ngFor="let contact of contacts" [value]="contact.idC.toString()">
          <mat-checkbox
            [value]="contact.idC.toString()"  
            (change)="updateSelectedContacts(contact.idC, $event)">
            {{ contact.name }} ({{ contact.phoneNumber }})
          </mat-checkbox>
        </mat-list-option>
      </mat-selection-list>
    </section>
    

    <!-- Submit Button -->
    <div class="pt-10 text-right">
      <button mat-raised-button color="primary" type="submit" [disabled]="requestForm.invalid">
        Submit Request
      </button>
    </div>

  </form>
</div>
