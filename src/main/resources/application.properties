spring.application.name=CallCenter
server.servlet.context-path=/api
server.port=8082
### DATABASE ###
spring.datasource.url=jdbc:mysql://localhost:3306/CallCenter?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
### JPA / HIBERNATE ###
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
##
spring.mvc.format.date=yyyy-MM-dd
logging.level.root=INFO
logging.pattern.console=%d {yyyy-MM-dd HH:mm:ss} - %level - %logger{45} - %msg %n 
#Swagger : http://localhost:8082/api/swagger-ui/index.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
file.upload-dir=C:/callcenter/files/
spring.main.allow-bean-definition-overriding=true
