spring.application.name=CallCenter
server.servlet.context-path=/api
server.port=8082
### DATABASE ###
spring.datasource.url=jdbc:mysql://localhost:3306/CallCenter?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
### JPA / HIBERNATE ###
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
##
spring.mvc.format.date=yyyy-MM-dd
logging.level.root=INFO
logging.pattern.console=%d {yyyy-MM-dd HH:mm:ss} - %level - %logger{45} - %msg %n 
#Swagger : http://localhost:8082/api/swagger-ui/index.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=C:/callcenter/files/
spring.main.allow-bean-definition-overriding=true

### Keycloak Configuration ###
keycloak.auth-server-url=http://192.168.10.161:8080/auth
keycloak.realm=Portal
keycloak.resource=uptech-rest-api
keycloak.public-client=true
keycloak.ssl-required=external
keycloak.principal-attribute=preferred_username
keycloak.use-resource-role-mappings=true
keycloak.confidential-port=0

### Spring Security OAuth2 Configuration ###
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://192.168.10.161:8080/realms/Portal
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs
